<h1>pj SDLC skills</h1>
<p class="lead">Version 0.2.0. Click a skill to open its <code>SKILL.md</code>.</p>
<div class="diagram">
<object data="flow.svg" type="image/svg+xml" aria-label="pj issue flow. A Fresh issue goes to pj-grill-for-specs-readiness. Grill asks questions with the needs-input label. A human answers and signs off the spec. For a UI change, pj-mock-it-up makes mockups, and a human picks one. Then the issue is spec-ready. pj-implement opens a PR, after pj-repro for a bug. pj-decompose splits an issue that is too big. With a PR ready for review, the issue has the Implemented state. pj-review and pj-address-review loop on the PR. A human merges the PR, and the issue gets the Done state. pj-prep-the-repo runs once for each repo. pj-doctor and pj-healthcheck change nothing.">
  <img src="flow.svg" alt="pj issue flow. A Fresh issue goes to pj-grill-for-specs-readiness. Grill asks questions with the needs-input label. A human answers and signs off the spec. For a UI change, pj-mock-it-up makes mockups, and a human picks one. Then the issue is spec-ready. pj-implement opens a PR, after pj-repro for a bug. pj-decompose splits an issue that is too big. With a PR ready for review, the issue has the Implemented state. pj-review and pj-address-review loop on the PR. A human merges the PR, and the issue gets the Done state. pj-prep-the-repo runs once for each repo. pj-doctor and pj-healthcheck change nothing.">
</object>

<h2>Protocol</h2>
<p>All skills follow one protocol: issue states, trust, markers, claim, sign-off, worktrees, and the devlog. It is in <a href="../skills/pj-prep-the-repo/reference/protocol.md"><code>reference/protocol.md</code></a>. Each skill is a <code>SKILL.md</code> in <a href="../skills/"><code>skills/</code></a>.</p>
