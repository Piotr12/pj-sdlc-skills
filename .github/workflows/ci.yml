name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: git --version && bash --version | head -1
      - run: bash tests/prep-scripts.sh
  lint:
    runs-on: ubuntu-24.04
    env:
      VALE_VERSION: "3.24.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JSON files parse
        run: for f in .claude-plugin/*.json hooks/hooks.json skills/pj-prep-the-repo/templates/*.json skills/pj-prep-the-repo/templates/rulesets/*.json; do python3 -m json.tool "$f" >/dev/null || exit 1; done
      - name: Shell syntax
        run: for f in skills/pj-prep-the-repo/scripts/*.sh hooks/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Vale
        run: |
          curl -sSfL -o vale.tgz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar xzf vale.tgz vale
          ./vale sync
          ./vale README.md AGENTS.md skills/*/SKILL.md skills/pj-prep-the-repo/reference skills/pj-prep-the-repo/templates/AGENTS.rules.md
