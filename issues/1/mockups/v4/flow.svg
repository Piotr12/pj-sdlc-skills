<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 488" width="880" height="488" role="img" aria-labelledby="t d">
  <title id="t">How an issue rides the pj skills</title>
  <desc id="d">Subway map of the pj flow. The feature line runs Fresh, pj-grill-for-specs-readiness, spec-ready, pj-implement, Implemented, human review and merge, Done. From grill, one loop goes to needs-input, where a human answers questions and signs off the spec, and one loop goes to pj-mock-it-up, where a human picks a mockup. The bug line goes from spec-ready through pj-repro to pj-implement. The too big line goes from pj-implement through pj-decompose back to spec-ready. The PR loop circles Implemented through pj-review and pj-address-review, in any order, until a human merges. pj-prep-the-repo prepares the repo once. pj-next-round and pj-healthcheck are read-only.</desc>
  <style>
    svg {
      --paper: #ffffff; --ink: #1f2328; --muted: #57606a;
      --feature: #1f5fbf; --bug: #c62828; --big: #9a6700; --pr: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #0d1117; --ink: #e6edf3; --muted: #9198a1;
        --feature: #5b9cf5; --bug: #f26b63; --big: #d4a23a; --pr: #46c35a;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .title { font-size: 19px; font-weight: 600; }
    .state { font-size: 15px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cap { fill: var(--muted); }
    .human { font-style: italic; }
    .ln { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .feature { stroke: var(--feature); } .bug { stroke: var(--bug); } .big { stroke: var(--big); } .pr { stroke: var(--pr); }
    .tick-feature { fill: var(--feature); } .tick-bug { fill: var(--bug); } .tick-big { fill: var(--big); } .tick-pr { fill: var(--pr); }
    .st { fill: var(--paper); stroke: var(--ink); stroke-width: 3.5; }
    .hu { fill: var(--ink); }
    .chev { fill: none; stroke: var(--paper); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .depot { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; }
    .ro { fill: var(--paper); stroke: var(--muted); stroke-width: 2; }
    .rule { stroke: var(--muted); stroke-width: 1; opacity: .35; }
  </style>
  <defs>
    <path id="chev" class="chev" d="M-1.75,-2.75 L1.75,0 L-1.75,2.75"/>
  </defs>

  <rect width="880" height="488" fill="var(--paper)"/>

  <!-- title and legend -->
  <text class="title" x="24" y="36">How an issue rides the pj skills</text>
  <g>
    <line class="ln feature" x1="28" y1="66" x2="50" y2="66"/><text x="60" y="70">Feature</text>
    <line class="ln bug" x1="128" y1="66" x2="150" y2="66"/><text x="160" y="70">Bug</text>
    <line class="ln big" x1="206" y1="66" x2="228" y2="66"/><text x="238" y="70">Too big</text>
    <line class="ln pr" x1="308" y1="66" x2="330" y2="66"/><text x="340" y="70">PR loop</text>
    <circle class="st" cx="470" cy="66" r="7" stroke-width="3"/><text x="484" y="70">issue state</text>
    <rect class="tick-feature" x="570" y="62" width="24" height="8" rx="4"/><rect class="tick-feature" x="579.5" y="55" width="5" height="10"/><text x="604" y="70">skill</text>
    <rect class="hu" x="656" y="59" width="14" height="14" rx="2"/><text x="678" y="70">a human acts</text>
  </g>

  <g transform="translate(0,-22)">
  <!-- lines -->
  <path class="ln bug" d="M420,290 L475,235 H515 L570,290"/>
  <path class="ln big" d="M570,290 L515,345 H475 L420,290"/>
  <circle class="ln pr" cx="745" cy="290" r="65"/>
  <path class="ln feature" d="M304,290 V194 Q304,170 280,170 H100 Q76,170 76,194 V290"/>
  <path class="ln feature" d="M304,290 V386 Q304,410 280,410 H100 Q76,410 76,386 V290"/>
  <path class="ln feature" d="M36,290 H852"/>
  <path class="depot" d="M36,300 V466"/>

  <!-- direction chevrons -->
  <use xlink:href="#chev" href="#chev" transform="translate(360,290)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(630,290)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(712,290)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(831,290)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(304,235) rotate(-90)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(190,170) rotate(180)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(76,235) rotate(90)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(304,345) rotate(90)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(184,410) rotate(180)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(76,345) rotate(-90)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(447.5,262.5) rotate(-45)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(542.5,262.5) rotate(45)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(542.5,317.5) rotate(135)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(447.5,317.5) rotate(-135)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(699,244) rotate(-45)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(791,244) rotate(45)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(791,336) rotate(135)"/>
  <use xlink:href="#chev" href="#chev" transform="translate(699,336) rotate(-135)"/>

  <!-- skill stations (ticks) -->
  <rect class="tick-feature" x="187.5" y="276" width="5" height="12"/>
  <rect class="tick-feature" x="237.5" y="412" width="5" height="12"/>
  <rect class="tick-feature" x="577.5" y="276" width="5" height="12"/>
  <rect class="tick-bug" x="492.5" y="221" width="5" height="12"/>
  <rect class="tick-big" x="492.5" y="347" width="5" height="12"/>
  <rect class="tick-pr" x="742.5" y="211" width="5" height="12"/>
  <rect class="tick-pr" x="742.5" y="357" width="5" height="12"/>

  <!-- state stations -->
  <circle class="st" cx="36" cy="290" r="9"/>
  <circle class="st" cx="250" cy="170" r="9"/>
  <circle class="st" cx="420" cy="290" r="9"/>
  <circle class="st" cx="680" cy="290" r="9"/>
  <circle class="st" cx="852" cy="290" r="9"/>

  <!-- human wait points -->
  <rect class="hu" x="121" y="163" width="14" height="14" rx="2"/>
  <rect class="hu" x="121" y="403" width="14" height="14" rx="2"/>
  <rect class="hu" x="803" y="283" width="14" height="14" rx="2"/>

  <!-- labels: feature line -->
  <text class="state" x="36" y="270" text-anchor="middle">Fresh</text>
  <text class="mono" x="190" y="268" text-anchor="middle">pj-grill-for-specs-readiness</text>
  <text class="state" x="250" y="150" text-anchor="middle">needs-input</text>
  <text class="human" x="128" y="134" text-anchor="middle">answer questions,</text>
  <text class="human" x="128" y="150" text-anchor="middle">sign off the spec</text>
  <text class="cap" x="292" y="330" text-anchor="end">UI change without a mockup</text>
  <text class="mono" x="240" y="440" text-anchor="middle">pj-mock-it-up</text>
  <text class="human" x="128" y="440" text-anchor="middle">pick a mockup</text>
  <text class="state" x="410" y="272" text-anchor="end">spec-ready</text>
  <text class="mono" x="574" y="270">pj-implement</text>
  <text class="state" x="672" y="320" text-anchor="end">Implemented</text>
  <text class="cap" x="672" y="337" text-anchor="end">PR ready for review</text>
  <text class="human" x="822" y="258">review,</text>
  <text class="human" x="822" y="273">merge</text>
  <text class="state" x="852" y="320" text-anchor="middle">Done</text>

  <!-- labels: bug and too big -->
  <text class="mono" x="495" y="214" text-anchor="middle">pj-repro</text>
  <text class="cap" x="495" y="197" text-anchor="middle">failing test first</text>
  <text class="mono" x="495" y="376" text-anchor="middle">pj-decompose</text>
  <text class="cap" x="495" y="393" text-anchor="middle">split into spec-ready children</text>

  <!-- labels: PR loop -->
  <text class="mono" x="745" y="204" text-anchor="middle">pj-review</text>
  <text class="mono" x="745" y="385" text-anchor="middle">pj-address-review</text>
  <text class="cap" x="745" y="258" text-anchor="middle">any order,</text>
  <text class="cap" x="745" y="273" text-anchor="middle">until merged</text>

  <!-- outside the issue flow -->
  <line class="rule" x1="24" y1="454" x2="856" y2="454"/>
  <rect class="ro" x="27" y="468" width="18" height="12" rx="2"/>
  <text class="mono" x="56" y="478">pj-prep-the-repo</text>
  <text class="cap" x="56" y="495">once per repo: labels, scripts, rules</text>
  <text class="cap" x="470" y="478">Read-only, any time:</text>
  <circle class="ro" cx="598" cy="474" r="5"/>
  <text class="mono" x="608" y="478">pj-next-round</text>
  <text class="cap" x="608" y="495">what to run next</text>
  <circle class="ro" cx="728" cy="474" r="5"/>
  <text class="mono" x="738" y="478">pj-healthcheck</text>
  <text class="cap" x="738" y="495">setup and docs drift</text>
  </g>
</svg>
