<svg xmlns="http://www.w3.org/2000/svg" width="880" height="456" viewBox="0 0 880 456" role="img" aria-labelledby="t d">
  <title id="t">pj SDLC flow: human and agent swimlanes</title>
  <desc id="d">Three lanes on one time axis. The agent lane runs pj-grill-for-specs-readiness, pj-mock-it-up, pj-repro, pj-implement, pj-decompose, pj-review, and pj-address-review. The forge lane shows the issue state: Fresh, needs-input, spec-ready, Implemented, Done. Four amber hand-offs climb to the human lane, where the agent stops until a human acts: 1 answer the questions, 2 pick a mockup, 3 sign off the spec, 4 review and merge the PR. Repo level: pj-prep-the-repo once, pj-next-round and pj-healthcheck read-only.</desc>
  <style>
    svg {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #6e7781; --rule: #d1d9e0;
      --lane: #f6f8fa; --chip: #eaeef2;
      --wait: #bf8700; --wait-fill: #ffd33d; --wait-ink: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #8b949e; --rule: #30363d;
        --lane: #151b23; --chip: #262c36;
        --wait: #d29922; --wait-fill: #d29922; --wait-ink: #0d1117;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lane-name { font-size: 15px; font-weight: 700; }
    .note { fill: var(--muted); }
    .state { font-weight: 600; }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
    .opt { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .track { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 4 3; }
    .head { fill: var(--line); }
    .act { fill: var(--wait-fill); stroke: var(--wait); stroke-width: 2; }
    .act-text { font-size: 15px; font-weight: 700; fill: var(--wait-ink); }
    .band { fill: var(--wait); stroke: var(--bg); stroke-width: 3; paint-order: stroke; }
    .badge { fill: var(--ink); }
    .badge-text { font-weight: 700; fill: var(--bg); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="456"/>

  <!-- lane labels and rules -->
  <rect class="lane" x="0" y="0" width="84" height="456"/>
  <rect class="lane" x="84" y="124" width="796" height="52"/>
  <line class="rule" x1="0" y1="124" x2="880" y2="124"/>
  <line class="rule" x1="0" y1="176" x2="880" y2="176"/>
  <line class="rule" x1="0" y1="372" x2="880" y2="372"/>

  <text class="lane-name" x="12" y="54">Human</text>
  <text class="note" x="12" y="74">you act,</text>
  <text class="note" x="12" y="90">agent waits</text>
  <text class="lane-name" x="12" y="148">Forge</text>
  <text class="note" x="12" y="166">issue state</text>
  <text class="lane-name" x="12" y="214">Agent</text>
  <text class="note" x="12" y="234">pj skills</text>
  <text class="note" x="12" y="258">dashed: only</text>
  <text class="note" x="12" y="274">when needed</text>
  <text class="lane-name" x="12" y="400">Repo</text>
  <text class="note" x="12" y="420">level</text>

  <!-- forge lane: issue state track -->
  <rect class="track" x="92" y="139" width="782" height="22" rx="11"/>
  <line class="rule" x1="500" y1="139" x2="500" y2="161"/>
  <line class="rule" x1="672" y1="139" x2="672" y2="161"/>
  <line class="rule" x1="820" y1="139" x2="820" y2="161"/>
  <text class="state" x="104" y="154">Fresh</text>
  <text class="state mono" x="204" y="154">needs-input</text>
  <text class="state mono" x="512" y="154">spec-ready</text>
  <text class="state" x="684" y="154">Implemented</text>
  <text class="state" x="847" y="154" text-anchor="middle">Done</text>

  <!-- agent lane: main row -->
  <rect class="chip" x="100" y="262" width="400" height="36" rx="6"/>
  <text class="mono" x="112" y="284">pj-grill-for-specs-readiness</text>
  <line class="edge" x1="500" y1="280" x2="545" y2="280" marker-end="url(#arr)"/>
  <rect class="chip" x="547" y="268" width="106" height="24" rx="6"/>
  <text class="mono" x="600" y="284" text-anchor="middle">pj-implement</text>
  <path class="edge" d="M653 280 H674 V264 H694" marker-end="url(#arr)"/>
  <rect class="chip" x="700" y="236" width="136" height="24" rx="6"/>
  <text class="mono" x="768" y="252" text-anchor="middle">pj-review</text>
  <rect class="chip" x="700" y="268" width="136" height="24" rx="6"/>
  <text class="mono" x="768" y="284" text-anchor="middle">pj-address-review</text>
  <path class="edge" d="M840 248 C858 248 858 280 840 280" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="note" x="768" y="312" text-anchor="middle">PR loop, any order</text>

  <!-- agent lane: optional skills -->
  <rect class="opt" x="300" y="188" width="112" height="24" rx="6"/>
  <text class="mono" x="356" y="204" text-anchor="middle">pj-mock-it-up</text>
  <line class="edge dash" x1="396" y1="262" x2="396" y2="214" marker-end="url(#arr)"/>
  <text class="note" x="388" y="232" text-anchor="end">UI change,</text>
  <text class="note" x="388" y="247" text-anchor="end">no mockup</text>

  <rect class="opt" x="536" y="188" width="128" height="24" rx="6"/>
  <text class="mono" x="600" y="204" text-anchor="middle">pj-repro (bugs)</text>
  <line class="edge dash" x1="600" y1="212" x2="600" y2="266" marker-end="url(#arr)"/>
  <text class="note" x="592" y="244" text-anchor="end">failing test first</text>

  <line class="edge dash" x1="600" y1="292" x2="600" y2="328" marker-end="url(#arr)"/>
  <text class="note" x="608" y="315">bite too big</text>
  <rect class="opt" x="547" y="330" width="106" height="24" rx="6"/>
  <text class="mono" x="600" y="346" text-anchor="middle">pj-decompose</text>
  <text class="note" x="662" y="346">child issues, each spec-ready</text>

  <!-- returns: the human answer goes back to the agent -->
  <line class="edge" x1="164" y1="96" x2="164" y2="260" marker-end="url(#arr)"/>
  <line class="edge" x1="292" y1="96" x2="292" y2="260" marker-end="url(#arr)"/>
  <line class="edge" x1="420" y1="96" x2="420" y2="260" marker-end="url(#arr)"/>
  <line class="edge" x1="752" y1="96" x2="752" y2="234" marker-end="url(#arr)"/>
  <path class="edge" d="M828 62 H847 V137" marker-end="url(#arr)"/>

  <!-- hand-offs: the agent stops, a human must act -->
  <path class="band" d="M188 262 V106 H183 L192 96 L201 106 H196 V262 Z"/>
  <path class="band" d="M316 188 V106 H311 L320 96 L329 106 H324 V188 Z"/>
  <path class="band" d="M444 262 V106 H439 L448 96 L457 106 H452 V262 Z"/>
  <path class="band" d="M776 236 V106 H771 L780 96 L789 106 H784 V236 Z"/>

  <rect class="act" x="120" y="30" width="116" height="64" rx="8"/>
  <text class="act-text" x="178" y="60" text-anchor="middle">Answer</text>
  <text class="act-text" x="178" y="80" text-anchor="middle">questions</text>
  <rect class="act" x="248" y="30" width="116" height="64" rx="8"/>
  <text class="act-text" x="306" y="60" text-anchor="middle">Pick</text>
  <text class="act-text" x="306" y="80" text-anchor="middle">a mockup</text>
  <rect class="act" x="376" y="30" width="116" height="64" rx="8"/>
  <text class="act-text" x="434" y="60" text-anchor="middle">Sign off</text>
  <text class="act-text" x="434" y="80" text-anchor="middle">the spec</text>
  <rect class="act" x="704" y="30" width="124" height="64" rx="8"/>
  <text class="act-text" x="766" y="60" text-anchor="middle">Review and</text>
  <text class="act-text" x="766" y="80" text-anchor="middle">merge the PR</text>

  <circle class="badge" cx="178" cy="30" r="10"/><text class="badge-text" x="178" y="34" text-anchor="middle">1</text>
  <circle class="badge" cx="306" cy="30" r="10"/><text class="badge-text" x="306" y="34" text-anchor="middle">2</text>
  <circle class="badge" cx="434" cy="30" r="10"/><text class="badge-text" x="434" y="34" text-anchor="middle">3</text>
  <circle class="badge" cx="766" cy="30" r="10"/><text class="badge-text" x="766" y="34" text-anchor="middle">4</text>

  <!-- repo level -->
  <rect class="chip" x="92" y="388" width="136" height="24" rx="6"/>
  <text class="mono" x="160" y="404" text-anchor="middle">pj-prep-the-repo</text>
  <text class="note" x="92" y="432">once: labels, AGENTS.md, attachments</text>
  <rect class="chip" x="344" y="388" width="114" height="24" rx="6"/>
  <text class="mono" x="401" y="404" text-anchor="middle">pj-next-round</text>
  <text class="note" x="344" y="432">read-only: what to run next</text>
  <rect class="chip" x="580" y="388" width="122" height="24" rx="6"/>
  <text class="mono" x="641" y="404" text-anchor="middle">pj-healthcheck</text>
  <text class="note" x="580" y="432">read-only: setup, attachments, docs</text>
</svg>
